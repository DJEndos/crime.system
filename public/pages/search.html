<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Records — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <div class="panel mb-3">
        <div class="p-3">
          <form id="searchForm" class="d-flex gap-2">
            <input type="text" class="form-control" id="q" placeholder="Search by case number, crime type, victim, suspect name, NIN, location…" required>
            <button class="btn btn-navy" type="submit">Search</button>
          </form>
        </div>
      </div>

      <div id="resultsWrap" class="d-none">
        <div class="row g-3">
          <div class="col-lg-6">
            <div class="panel">
              <div class="panel-header">Crime Records</div>
              <table class="records mb-0">
                <thead><tr><th>Case #</th><th>Type</th><th>Status</th></tr></thead>
                <tbody id="crimeResults"></tbody>
              </table>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="panel">
              <div class="panel-header">Suspects</div>
              <table class="records mb-0">
                <thead><tr><th>Name</th><th>Case #</th><th>Status</th></tr></thead>
                <tbody id="suspectResults"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="emptyWrap" class="empty-state d-none">
        <div class="icon">&#128269;</div>
        Enter a search term above — case numbers, crime types, victim or suspect names, locations, or NIN.
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (requireAuth()) {
  renderSidebar('/pages/search.html');
  renderTopbar('Search Records');
  document.getElementById('emptyWrap').classList.remove('d-none');
}

document.getElementById('searchForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  try {
    const data = await apiRequest(`/search?q=${encodeURIComponent(q)}`);
    document.getElementById('emptyWrap').classList.add('d-none');
    document.getElementById('resultsWrap').classList.remove('d-none');

    document.getElementById('crimeResults').innerHTML = data.crimes.length ? data.crimes.map(c => `
      <tr onclick="window.location.href='/pages/crime-detail.html?id=${c.id}'">
        <td class="mono">${escapeHtml(c.case_number)}</td><td>${escapeHtml(c.crime_type)}</td><td>${stampHtml(c.status)}</td>
      </tr>`).join('') : `<tr><td colspan="3" class="empty-state">No matching crime records.</td></tr>`;

    document.getElementById('suspectResults').innerHTML = data.suspects.length ? data.suspects.map(s => `
      <tr><td>${escapeHtml(s.full_name)}</td><td class="mono">${escapeHtml(s.case_number)}</td><td>${stampHtml(s.status)}</td></tr>
    `).join('') : `<tr><td colspan="3" class="empty-state">No matching suspects.</td></tr>`;

  } catch (err) { showToast(err.message, 'danger'); }
});
</script>
</body>
</html>
