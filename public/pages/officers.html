<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer Accounts — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-gold btn-sm" data-bs-toggle="modal" data-bs-target="#newOfficerModal">+ New Officer Account</button>
      </div>

      <div class="panel">
        <div class="panel-header">Registered Officer Accounts</div>
        <table class="records mb-0">
          <thead><tr><th>Name</th><th>Badge #</th><th>Role</th><th>Rank</th><th>Station</th></tr></thead>
          <tbody id="officersBody"><tr><td colspan="5" class="text-center text-muted py-4">Loading…</td></tr></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="newOfficerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="newOfficerForm">
        <div class="modal-header"><h5 class="modal-title display-font">New Officer Account</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Full name</label><input class="form-control" id="full_name" required></div>
          <div class="mb-2"><label class="form-label">Badge number</label><input class="form-control" id="badge_number" required></div>
          <div class="mb-2"><label class="form-label">Username</label><input class="form-control" id="username" required></div>
          <div class="mb-2"><label class="form-label">Temporary password</label><input type="password" class="form-control" id="password" required></div>
          <div class="row g-2">
            <div class="col-6"><label class="form-label">Role</label>
              <select class="form-select" id="role">
                <option value="ipo">IPO</option><option value="dco">DCO</option><option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-6"><label class="form-label">Rank</label><input class="form-control" id="officer_rank"></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-navy" type="submit">Create Account</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
if (requireAuth()) {
  const user = getUser();
  if (!user || user.role !== 'admin') {
    document.querySelector('.page-body').innerHTML = `<div class="empty-state">You do not have permission to view this page.</div>`;
  } else {
    renderSidebar('/pages/officers.html');
    renderTopbar('Officer Accounts');
    loadOfficers();
  }
}

async function loadOfficers() {
  try {
    const data = await apiRequest('/auth/officers');
    document.getElementById('officersBody').innerHTML = data.officers.map(o => `
      <tr><td>${escapeHtml(o.full_name)}</td><td class="mono">${escapeHtml(o.badge_number)}</td>
      <td class="text-uppercase">${escapeHtml(o.role)}</td><td>${escapeHtml(o.officer_rank || '—')}</td><td>${escapeHtml(o.station || '—')}</td></tr>
    `).join('');
  } catch (err) { showToast(err.message, 'danger'); }
}

document.getElementById('newOfficerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await apiRequest('/auth/register', { method: 'POST', body: {
      full_name: document.getElementById('full_name').value,
      badge_number: document.getElementById('badge_number').value,
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role').value,
      officer_rank: document.getElementById('officer_rank').value
    }});
    bootstrap.Modal.getInstance(document.getElementById('newOfficerModal')).hide();
    document.getElementById('newOfficerForm').reset();
    showToast('Officer account created.');
    loadOfficers();
  } catch (err) { showToast(err.message, 'danger'); }
});
</script>
</body>
</html>
