<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suspects — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <div class="d-flex flex-wrap gap-2 mb-3">
        <select class="form-select form-select-sm" id="filterStatus" style="width:auto;">
          <option value="">All statuses</option>
          <option value="at_large">At large</option>
          <option value="arrested">Arrested</option>
          <option value="released">Released</option>
          <option value="convicted">Convicted</option>
        </select>
        <select class="form-select form-select-sm" id="filterGender" style="width:auto;">
          <option value="">All genders</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="panel">
        <div class="panel-header">Suspect Records <span class="text-muted small">Add suspects from within a case file</span></div>
        <table class="records mb-0">
          <thead><tr><th>Name</th><th>Case #</th><th>Crime type</th><th>Gender</th><th>Age</th><th>Status</th></tr></thead>
          <tbody id="suspectsBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (requireAuth()) {
  renderSidebar('/pages/suspects.html');
  renderTopbar('Suspects');
  loadSuspects();
  document.getElementById('filterStatus').addEventListener('change', loadSuspects);
  document.getElementById('filterGender').addEventListener('change', loadSuspects);
}

async function loadSuspects() {
  const status = document.getElementById('filterStatus').value;
  const gender = document.getElementById('filterGender').value;
  const qs = new URLSearchParams();
  if (status) qs.set('status', status);
  if (gender) qs.set('gender', gender);

  try {
    const data = await apiRequest(`/suspects${qs.toString() ? '?' + qs.toString() : ''}`);
    const tbody = document.getElementById('suspectsBody');
    tbody.innerHTML = data.suspects.length ? data.suspects.map(s => `
      <tr onclick="window.location.href='/pages/crimes.html'">
        <td>${escapeHtml(s.full_name)}${s.alias ? ` <span class="text-muted small">alias ${escapeHtml(s.alias)}</span>` : ''}</td>
        <td class="mono">${escapeHtml(s.case_number)}</td>
        <td>${escapeHtml(s.crime_type)}</td>
        <td>${escapeHtml(s.gender)}</td>
        <td>${s.age || '—'}</td>
        <td>${stampHtml(s.status)}</td>
      </tr>`).join('') : `<tr><td colspan="6" class="empty-state">No suspects match this filter.</td></tr>`;
  } catch (err) { showToast(err.message, 'danger'); }
}
</script>
</body>
</html>
