<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Tracking — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <div class="panel">
        <div class="panel-header">Court &amp; Case Tracking Records <span class="text-muted small">Add entries from within a case file</span></div>
        <table class="records mb-0">
          <thead><tr><th>Case #</th><th>Crime type</th><th>Suspect</th><th>Court</th><th>Hearing date</th><th>Verdict</th></tr></thead>
          <tbody id="casesBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (requireAuth()) {
  renderSidebar('/pages/cases.html');
  renderTopbar('Case Tracking');
  loadCases();
}

async function loadCases() {
  try {
    const data = await apiRequest('/cases');
    const tbody = document.getElementById('casesBody');
    tbody.innerHTML = data.courtRecords.length ? data.courtRecords.map(r => `
      <tr>
        <td class="mono">${escapeHtml(r.case_number)}</td>
        <td>${escapeHtml(r.crime_type)}</td>
        <td>${escapeHtml(r.suspect_name || '—')}</td>
        <td>${escapeHtml(r.court_name || '—')}</td>
        <td>${formatDate(r.hearing_date)}</td>
        <td>${stampHtml(r.verdict)}</td>
      </tr>`).join('') : `<tr><td colspan="6" class="empty-state">No court records yet. Add one from a case file.</td></tr>`;
  } catch (err) { showToast(err.message, 'danger'); }
}
</script>
</body>
</html>
