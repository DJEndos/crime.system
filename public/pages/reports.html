<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <div class="row g-3 mb-3">
        <div class="col-lg-6">
          <div class="panel">
            <div class="panel-header">Daily Crime Report</div>
            <div class="p-3">
              <div class="d-flex gap-2 mb-3">
                <input type="date" class="form-control" id="dailyDate">
                <button class="btn btn-navy" id="loadDailyBtn">Load</button>
              </div>
              <table class="records mb-0">
                <thead><tr><th>Case #</th><th>Type</th><th>Location</th><th>Status</th></tr></thead>
                <tbody id="dailyBody"><tr><td colspan="4" class="empty-state">Choose a date and click Load.</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="panel mb-3">
            <div class="panel-header">Male / Female Breakdown</div>
            <div class="p-3" id="genderReportBody">Loading…</div>
          </div>
          <div class="panel">
            <div class="panel-header">Case Status Breakdown</div>
            <div class="p-3" id="statusReportBody">Loading…</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">Export Printable Report (PDF)</div>
        <div class="p-3">
          <form id="exportForm" class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label">From</label><input type="date" class="form-control" id="exp_from"></div>
            <div class="col-md-3"><label class="form-label">To</label><input type="date" class="form-control" id="exp_to"></div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="exp_status">
                <option value="">All</option>
                <option value="open">Open</option>
                <option value="under_investigation">Under investigation</option>
                <option value="in_court">In court</option>
                <option value="closed">Closed</option>
              </select>
            </div>
            <div class="col-md-3"><button type="submit" class="btn btn-gold w-100">Download PDF</button></div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/public/js/app.js"></script>
<script>
if (requireAuth()) {
  renderSidebar('/pages/reports.html');
  renderTopbar('Reports');
  document.getElementById('dailyDate').value = new Date().toISOString().slice(0,10);
  loadGenderReport();
  loadStatusReport();
}

document.getElementById('loadDailyBtn').addEventListener('click', async () => {
  const date = document.getElementById('dailyDate').value;
  try {
    const data = await apiRequest(`/reports/daily?date=${date}`);
    const tbody = document.getElementById('dailyBody');
    tbody.innerHTML = data.crimes.length ? data.crimes.map(c => `
      <tr onclick="window.location.href='/pages/crime-detail.html?id=${c.id}'">
        <td class="mono">${escapeHtml(c.case_number)}</td><td>${escapeHtml(c.crime_type)}</td>
        <td>${escapeHtml(c.location || '—')}</td><td>${stampHtml(c.status)}</td>
      </tr>`).join('') : `<tr><td colspan="4" class="empty-state">No crimes reported on this date.</td></tr>`;
  } catch (err) { showToast(err.message, 'danger'); }
});

async function loadGenderReport() {
  try {
    const data = await apiRequest('/reports/gender');
    const row = (label, arr) => arr.map(a => `<div class="d-flex justify-content-between border-bottom py-1"><span>${escapeHtml(a.gender)}</span><strong>${a.count}</strong></div>`).join('');
    document.getElementById('genderReportBody').innerHTML = `
      <div class="mb-2 text-muted small text-uppercase">Victims</div>${row('Victims', data.victims)}
      <div class="mt-3 mb-2 text-muted small text-uppercase">Suspects</div>${row('Suspects', data.suspects)}
    `;
  } catch (err) { document.getElementById('genderReportBody').textContent = err.message; }
}

async function loadStatusReport() {
  try {
    const data = await apiRequest('/reports/status');
    document.getElementById('statusReportBody').innerHTML = data.statusBreakdown.map(s => `
      <div class="d-flex justify-content-between border-bottom py-1"><span>${stampHtml(s.status)}</span><strong>${s.count}</strong></div>
    `).join('');
  } catch (err) { document.getElementById('statusReportBody').textContent = err.message; }
}

document.getElementById('exportForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const params = new URLSearchParams();
  const from = document.getElementById('exp_from').value;
  const to = document.getElementById('exp_to').value;
  const status = document.getElementById('exp_status').value;
  if (from) params.set('date_from', from);
  if (to) params.set('date_to', to);
  if (status) params.set('status', status);

  // PDF download needs the token appended since it's a plain navigation, not fetch
  const token = getToken();
  fetch(`/api/reports/export/pdf?${params.toString()}`, { headers: { Authorization: `Bearer ${token}` } })
    .then(res => res.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'crime_report.pdf';
      document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(() => showToast('Could not generate PDF.', 'danger'));
});
</script>
</body>
</html>
