<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>

<div class="letterhead-wrap">
  <div class="auth-card">
    <div class="text-center">
      <div class="seal">NPF</div>
      <div class="auth-eyebrow">Nigerian Police Force</div>
      <h1 class="h4 mb-1">Crime Tracking Information System</h1>
      <p class="text-muted small mb-4">Ikot Udota Division &middot; Eket</p>
    </div>

    <div id="errorBox" class="alert alert-danger py-2 small d-none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-navy w-100" id="loginBtn">Sign in</button>
    </form>

    <p class="text-center text-muted mt-4" style="font-size:0.75rem;">
      Authorized personnel only. All access is logged.
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (getToken()) window.location.href = '/pages/dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('loginBtn');
    errorBox.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Login failed');

      setSession(data.token, data.user);
      window.location.href = '/pages/dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
