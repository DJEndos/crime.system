<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Detail — Crime Tracking System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div id="topbar-root"></div>
    <div class="page-body">

      <a href="/pages/crimes.html" class="small d-inline-block mb-3">&larr; Back to Crime Records</a>

      <div id="caseContent">
        <div class="text-center text-muted py-5">Loading case file…</div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const crimeId = params.get('id');

if (requireAuth()) {
  renderSidebar('/pages/crimes.html');
  renderTopbar('Case Detail');
  if (!crimeId) {
    document.getElementById('caseContent').innerHTML = `<div class="empty-state">No case selected.</div>`;
  } else {
    loadCase();
  }
}

async function loadCase() {
  try {
    const data = await apiRequest(`/crimes/${crimeId}`);
    const c = data.crime;

    document.getElementById('caseContent').innerHTML = `
      <div class="panel mb-3">
        <div class="panel-header">
          <span>${escapeHtml(c.crime_type)} <span class="mono text-muted small">#${escapeHtml(c.case_number)}</span></span>
          ${stampHtml(c.status)}
        </div>
        <div class="p-3">
          <div class="row g-3 mb-3">
            <div class="col-md-3"><div class="text-muted small">Location</div><div>${escapeHtml(c.location || '—')}</div></div>
            <div class="col-md-3"><div class="text-muted small">Date occurred</div><div>${formatDate(c.date_occurred)}</div></div>
            <div class="col-md-3"><div class="text-muted small">Date reported</div><div>${formatDate(c.date_reported)}</div></div>
            <div class="col-md-3"><div class="text-muted small">Assigned officer</div><div>${escapeHtml(c.assigned_officer_name || 'Unassigned')}</div></div>
            <div class="col-md-3"><div class="text-muted small">Victim</div><div>${escapeHtml(c.victim_name || '—')}</div></div>
            <div class="col-md-3"><div class="text-muted small">Victim gender</div><div>${escapeHtml(c.victim_gender)}</div></div>
            <div class="col-md-3"><div class="text-muted small">Victim phone</div><div>${escapeHtml(c.victim_phone || '—')}</div></div>
            <div class="col-md-3"><div class="text-muted small">Reported by</div><div>${escapeHtml(c.reported_by_name || '—')}</div></div>
          </div>
          <div class="text-muted small">Description</div>
          <p>${escapeHtml(c.description || 'No description recorded.')}</p>

          <div class="d-flex gap-2 align-items-center mt-3">
            <label class="form-label mb-0">Update status:</label>
            <select class="form-select form-select-sm" style="width:auto;" id="statusSelect">
              ${['open','under_investigation','in_court','closed'].map(s => `<option value="${s}" ${s===c.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
            </select>
            <button class="btn btn-sm btn-navy" id="updateStatusBtn">Update</button>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="panel">
            <div class="panel-header">
              Suspects
              <button class="btn btn-sm btn-gold" data-bs-toggle="modal" data-bs-target="#addSuspectModal">+ Add</button>
            </div>
            <table class="records mb-0">
              <thead><tr><th>Name</th><th>Gender</th><th>Status</th></tr></thead>
              <tbody>
                ${data.suspects.length ? data.suspects.map(s => `
                  <tr><td>${escapeHtml(s.full_name)}${s.alias ? ` <span class="text-muted small">alias ${escapeHtml(s.alias)}</span>` : ''}</td>
                  <td>${escapeHtml(s.gender)}</td><td>${stampHtml(s.status)}</td></tr>
                `).join('') : `<tr><td colspan="3" class="empty-state">No suspects linked yet.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="panel">
            <div class="panel-header">
              Court / Case Tracking
              <button class="btn btn-sm btn-gold" data-bs-toggle="modal" data-bs-target="#addCourtModal">+ Add</button>
            </div>
            <table class="records mb-0">
              <thead><tr><th>Court</th><th>Hearing</th><th>Verdict</th></tr></thead>
              <tbody>
                ${data.courtRecords.length ? data.courtRecords.map(r => `
                  <tr><td>${escapeHtml(r.court_name || '—')}</td><td>${formatDate(r.hearing_date)}</td><td>${stampHtml(r.verdict)}</td></tr>
                `).join('') : `<tr><td colspan="3" class="empty-state">No court records yet.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    document.getElementById('updateStatusBtn').addEventListener('click', async () => {
      try {
        await apiRequest(`/crimes/${crimeId}`, { method: 'PUT', body: { status: document.getElementById('statusSelect').value } });
        showToast('Status updated.');
        loadCase();
      } catch (err) { showToast(err.message, 'danger'); }
    });

  } catch (err) {
    document.getElementById('caseContent').innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
  }
}
</script>

<!-- Add Suspect Modal -->
<div class="modal fade" id="addSuspectModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addSuspectForm">
        <div class="modal-header"><h5 class="modal-title display-font">Add Suspect</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Full name</label><input class="form-control" id="s_full_name" required></div>
          <div class="mb-2"><label class="form-label">Alias</label><input class="form-control" id="s_alias"></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="form-label">Gender</label><select class="form-select" id="s_gender"><option value="unknown">Unknown</option><option value="male">Male</option><option value="female">Female</option></select></div>
            <div class="col-6"><label class="form-label">Age</label><input type="number" class="form-control" id="s_age"></div>
          </div>
          <div class="mb-2"><label class="form-label">Address</label><input class="form-control" id="s_address"></div>
          <div class="mb-2"><label class="form-label">National ID / NIN</label><input class="form-control" id="s_national_id"></div>
          <div class="mb-2"><label class="form-label">Status</label>
            <select class="form-select" id="s_status">
              <option value="at_large">At large</option><option value="arrested">Arrested</option>
              <option value="released">Released</option><option value="convicted">Convicted</option>
            </select>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-navy" type="submit">Save</button></div>
      </form>
    </div>
  </div>
</div>

<!-- Add Court Record Modal -->
<div class="modal fade" id="addCourtModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addCourtForm">
        <div class="modal-header"><h5 class="modal-title display-font">Add Court Record</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Court name</label><input class="form-control" id="c_court_name"></div>
          <div class="mb-2"><label class="form-label">Case file no.</label><input class="form-control" id="c_case_file_no"></div>
          <div class="mb-2"><label class="form-label">Judge</label><input class="form-control" id="c_judge_name"></div>
          <div class="mb-2"><label class="form-label">Hearing date</label><input type="date" class="form-control" id="c_hearing_date"></div>
          <div class="mb-2"><label class="form-label">Verdict</label>
            <select class="form-select" id="c_verdict">
              <option value="pending">Pending</option><option value="adjourned">Adjourned</option>
              <option value="guilty">Guilty</option><option value="not_guilty">Not guilty</option><option value="dismissed">Dismissed</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Notes</label><textarea class="form-control" id="c_notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-navy" type="submit">Save</button></div>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('addSuspectForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await apiRequest('/suspects', { method: 'POST', body: {
      crime_id: crimeId,
      full_name: document.getElementById('s_full_name').value,
      alias: document.getElementById('s_alias').value,
      gender: document.getElementById('s_gender').value,
      age: document.getElementById('s_age').value || null,
      address: document.getElementById('s_address').value,
      national_id: document.getElementById('s_national_id').value,
      status: document.getElementById('s_status').value
    }});
    bootstrap.Modal.getInstance(document.getElementById('addSuspectModal')).hide();
    document.getElementById('addSuspectForm').reset();
    showToast('Suspect added.');
    loadCase();
  } catch (err) { showToast(err.message, 'danger'); }
});

document.getElementById('addCourtForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await apiRequest('/cases', { method: 'POST', body: {
      crime_id: crimeId,
      court_name: document.getElementById('c_court_name').value,
      case_file_no: document.getElementById('c_case_file_no').value,
      judge_name: document.getElementById('c_judge_name').value,
      hearing_date: document.getElementById('c_hearing_date').value || null,
      verdict: document.getElementById('c_verdict').value,
      notes: document.getElementById('c_notes').value
    }});
    bootstrap.Modal.getInstance(document.getElementById('addCourtModal')).hide();
    document.getElementById('addCourtForm').reset();
    showToast('Court record added.');
    loadCase();
  } catch (err) { showToast(err.message, 'danger'); }
});
</script>
</body>
</html>
